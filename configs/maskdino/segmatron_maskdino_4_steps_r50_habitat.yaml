RANDOM_SEED: 23567
MODEL:
  TYPE: "maskdino_segmatron"
  CONFIG: ./configs/maskdino/maskdino_R50_bs16_160k_steplr.yaml
  WEIGHTS: ./checkpoints/maskdino/maskdino_r50_50ep_100q_celoss_hid1024_3s_semantic_ade20k_48.7miou.pth
  TRANSFORMER: "GPT"
  NUM_QUERIES: 100
  EMBEDDING_PDROP: 0.1
  RESIDUAL_PDROP: 0.1
  ATTENTION_PDROP: 0.1
  NUM_CLASSES: 150
  INPUT_RESOLUTION: 320
  NUM_LAYERS: 4
  NUM_HEADS: 8
  EMBEDDING_DIM: 512
  BLOCK_SIZE: 2060
  IMG_FEATURE_SIZE: 256
  OUTPUT_SIZE: 512
  MASK_EMB_SIZE: 256
  ADAPTIVE_LR: 1e-3
  NUM_ACTIONS: 5
  ADAPTIVE_BACKBONE: True
DATASET:
  TEST:
    TYPE: "multistep"
    MODE: "test"
    ANNOTATION_ROOT: "data/segmatron_habitat/annotations/segmatron_v1_val.json"
    IMAGE_ROOT: "data/segmatron_habitat/val"
EVALUATOR:
  TYPE: "random_policy_evaluator"
  BATCH_SIZE: 1
  NUM_WORKERS: 1
  OUTPUT_DIRECTORY: "evaluation_results/segmatron_maskdino_habitat"
  CHECKPOINT: "checkpoints/segmatron_maskdino.pt"
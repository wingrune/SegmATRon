RANDOM_SEED: 96964
MODEL:
  TYPE: "mask2former_segmatron"
  CONFIG: ./configs/mask2former/config_mask2former_ade20k_r50.yaml
  WEIGHTS: checkpoints/mask2former/model_final_500878.pkl
  TRANSFORMER: "GPT"
  EMBEDDING_PDROP: 0.1
  RESIDUAL_PDROP: 0.1
  ATTENTION_PDROP: 0.1
  NUM_QUERIES: 100
  NUM_CLASSES: 150
  INPUT_RESOLUTION: 320
  NUM_LAYERS: 4
  NUM_HEADS: 8
  EMBEDDING_DIM: 512
  BLOCK_SIZE: 2060
  IMG_FEATURE_SIZE: 256
  OUTPUT_SIZE: 512
  MASK_EMB_SIZE: 256
  ADAPTIVE_LR: 1e-3
  NUM_ACTIONS: 5
  ADAPTIVE_BACKBONE: True
DATASET:
  TEST:
    TYPE: "multistep"
    MODE: "test"
    ANNOTATION_ROOT: "data/segmatron_ai2thor/annotations/segmatron_v1_test.json"
    IMAGE_ROOT: "data/segmatron_ai2thor/test"
EVALUATOR:
  TYPE: "random_policy_evaluator"
  BATCH_SIZE: 1
  NUM_WORKERS: 1
  OUTPUT_DIRECTORY: "evaluation_results/segmatron_mask2former_ai2thor"
  CHECKPOINT: "checkpoints/segmatron_mask2former.pt"